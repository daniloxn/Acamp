[project]
name = "estudo-app"
version = "0.1.0"
description = "YouTube -> Whisper (GPU) -> Ollama -> JSON de estudo"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.5",
    "nvidia-cublas-cu12==12.9.2.10",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cudnn-cu12==9.28.1.4",
    "av==15.1.0",  # av>=16 removeu `metadata_errors`, usado pelo faster-whisper 1.2.1
    "yt-dlp",
    "pydantic>=2",
    "ollama",
    "sqlmodel>=0.0.48",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "fastapi>=0.162.2",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.33",
]
